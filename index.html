:root{--bg:#faf7f0;--card:#fff;--tx:#2a2118;--mu:#7a6e5f;--ac:#8a5a14;--ok:#1f7a3d;--no:#b3261e;--bd:#e4dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1712;--card:#262019;--tx:#f1e9da;--mu:#a99c88;--ac:#e0a458;--ok:#5fc47f;--no:#ff8a80;--bd:#3a3226}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font:700 1.7rem Georgia,serif;margin:.2em 0}
.mu{color:var(--mu)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:12px}
.t{font:700 1.3rem ui-monospace,monospace}.t.low{color:var(--no)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--card));font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{padding:6px 0;font-size:.85rem}
.pal .done{background:var(--ac);color:#fff;border-color:var(--ac)}
.pal .cur{outline:2px solid var(--tx)}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.sc{font:700 3rem Georgia,serif;text-align:center;margin:.1em 0}
.rv{border-left:5px solid var(--bd)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--no)}
.a{padding:3px 0}.a.c{color:var(--ok);font-weight:700}.a.w{color:var(--no);font-weight:700}
.hide{display:none}
</style>
</head>

var app=document.getElementById('app'),S={};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}

function home(){
  var n=Math.min(PER_SESSION,BANK.length);
  app.innerHTML='<div class="card"><h1>Book of Joshua CBT from Reach Technology LLC</h1><p class="mu">Test your knowledge of the Book of Joshua.</p>'+
  '<p><b>'+n+'</b> questions &middot; <b>'+DURATION_MIN+' minutes</b> &middot; auto-submits when time runs out.</p>'+
  '<p><input id="nm" placeholder="Your name (optional)" style="font:inherit;padding:10px;width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></p>'+
  '<button class="p" id="go">Start exam</button></div>';
  document.getElementById('go').onclick=function(){start(document.getElementById('nm').value.trim())};
}

function start(name){
  var qs=shuf(BANK).slice(0,PER_SESSION).map(function(r){return{q:r[0],c:r[1],o:shuf(r.slice(1)),a:null}});
  S={name:name,qs:qs,i:0,left:DURATION_MIN*60,done:false};
  S.tm=setInterval(function(){S.left--;var t=document.getElementById('tm');if(t){t.textContent=fmt(S.left);t.className='t'+(S.left<=300?' low':'')}if(S.left<=0)finish(true)},1000);
  render();
}

function render(){
  var q=S.qs[S.i],ans=S.qs.filter(function(x){return x.a!==null}).length;
  var h='<div class="bar"><div><b>Q '+(S.i+1)+'</b> / '+S.qs.length+' <span class="mu">&middot; answered '+ans+'</span></div><div id="tm" class="t'+(S.left<=300?' low':'')+'">'+fmt(S.left)+'</div></div>';
  h+='<div class="card"><p style="font-size:1.1rem;margin-top:0">'+esc(q.q)+'</p>';
  q.o.forEach(function(o,k){h+='<button class="opt'+(q.a===o?' sel':'')+'" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>'});
  h+='<div class="row"><button id="pv"'+(S.i===0?' disabled':'')+'>&larr; Prev</button>'+
     (S.i<S.qs.length-1?'<button class="p" id="nx">Next &rarr;</button>':'<button class="p" id="sb">Submit</button>')+'</div></div>';
  h+='<div class="card"><div class="pal">';
  S.qs.forEach(function(x,k){h+='<button data-p="'+k+'" class="'+(x.a!==null?'done ':'')+(k===S.i?'cur':'')+'">'+(k+1)+'</button>'});
  h+='</div><div class="row"><span class="mu">Tap a number to jump.</span><button id="sb2">Submit exam</button></div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){q.a=q.o[+b.dataset.k];render()}});
  app.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){S.i=+b.dataset.p;render()}});
  var pv=document.getElementById('pv'),nx=document.getElementById('nx'),sb=document.getElementById('sb'),sb2=document.getElementById('sb2');
  pv.onclick=function(){S.i--;render()};
  if(nx)nx.onclick=function(){S.i++;render()};
  function ask(){var un=S.qs.length-S.qs.filter(function(x){return x.a!==null}).length;if(confirm(un?('You have '+un+' unanswered question(s). Submit anyway?'):'Submit your exam now?'))finish(false)}
  if(sb)sb.onclick=ask;sb2.onclick=ask;
}

function finish(auto){
  if(S.done)return;S.done=true;clearInterval(S.tm);
  var sc=S.qs.filter(function(x){return x.a===x.c}).length,tot=S.qs.length,pc=Math.round(sc/tot*100);
  var h='<div class="card"><p class="mu" style="text-align:center;margin:0">'+(auto?'Time is up &mdash; exam auto-submitted.':'Exam submitted.')+(S.name?' '+esc(S.name):'')+'</p>'+
  '<div class="sc">'+sc+' / '+tot+'</div><p style="text-align:center;margin:0" class="mu">'+pc+'% &middot; '+(pc>=70?'Excellent work!':pc>=50?'Good effort, review the misses below.':'Keep studying and try again.')+'</p>'+
  '<div class="row" style="justify-content:center"><button class="p" id="re">Take another session</button></div></div><h2>Review</h2>';
  S.qs.forEach(function(x,k){
    var ok=x.a===x.c;
    h+='<div class="card rv '+(ok?'ok':'no')+'"><b>'+(k+1)+'. '+esc(x.q)+'</b>';
    x.o.forEach(function(o,j){
      var cls=o===x.c?'c':(o===x.a?'w':'');
      var tag=o===x.c?' &#10003; correct':(o===x.a?' &#10007; your answer':'');
      h+='<div class="a '+cls+'">'+String.fromCharCode(65+j)+'. '+esc(o)+tag+'</div>';
    });
    if(x.a===null)h+='<div class="mu">Not answered</div>';
    h+='</div>';
  });
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('re').onclick=home;
}
home();
</script>
</body>
</html>
